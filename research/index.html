<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'" />
  <title>피드백 참여 종료 · CHAESTRO</title>
  <style>
    :root{color-scheme:dark;--bg:#05070b;--text:#f7f5ee;--muted:#aaa9a4;--gold:#e6c16a;--cyan:#76f4ff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:
      radial-gradient(700px 360px at 16% 10%,rgba(151,185,255,.12),transparent 70%),
      radial-gradient(600px 360px at 88% 82%,rgba(118,244,255,.10),transparent 72%),var(--bg);
      color:var(--text);font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(620px,100%);padding:34px;border:1px solid rgba(255,255,255,.14);border-radius:28px;background:rgba(255,255,255,.045);box-shadow:0 28px 90px rgba(0,0,0,.35)}
    .brand{font-size:13px;font-weight:900;letter-spacing:.18em;color:var(--gold)}
    h1{margin:18px 0 14px;font-size:clamp(30px,7vw,52px);line-height:1.08;letter-spacing:-.045em;word-break:keep-all}
    p{margin:0;color:var(--muted);line-height:1.75;word-break:keep-all}
    .badge{display:inline-flex;margin-top:20px;padding:7px 10px;border:1px solid rgba(118,244,255,.24);border-radius:999px;color:var(--cyan);font-size:12px;font-weight:800}
    a{display:inline-flex;margin-top:24px;min-height:48px;align-items:center;justify-content:center;padding:0 20px;border-radius:999px;background:linear-gradient(135deg,#ffe39c,var(--cyan));color:#080a0d;text-decoration:none;font-weight:900}
  </style>
</head>
<body>
  <main>
    <div class="brand">CHAESTRO</div>
    <h1>피드백 참여가 종료되었습니다.</h1>
    <p>참여해 주셔서 감사합니다. 기존 Research 체험은 종료되었으며 더 이상 응답을 받지 않습니다.</p>
    <span class="badge">RESEARCH CLOSED</span><br />
    <a href="/">채스트로 홈페이지로 돌아가기</a>
  </main>
</body>
</html>
